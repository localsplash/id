<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Account</title>
  <link rel="icon" href="/img/id-favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-11 h-11 rounded-xl bg-slate-800 flex items-center justify-center">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8.5" r="3.5"/><path stroke-linecap="round" d="M5 19.5c1.4-3.2 4-4.8 7-4.8s5.6 1.6 7 4.8"/>
        </svg>
      </div>
      <div>
        <h1 class="text-lg font-bold text-slate-800" id="who">Your account</h1>
        <p class="text-xs text-slate-500">Signed in across this domain</p>
      </div>
    </div>

    <div id="banner" class="hidden mb-4 px-4 py-3 rounded-xl text-sm"></div>

    <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Sign-in methods</h2>
    <div id="identities" class="space-y-1.5 mb-4"></div>

    <div id="linkButtons" class="space-y-2 mb-6"></div>

    <div class="border-t border-slate-100 pt-4 flex items-center justify-between">
      <a id="adminLink" href="/admin" class="hidden text-sm font-medium text-blue-600 hover:text-blue-700">Admin console →</a>
      <div class="flex gap-3 ml-auto">
        <button id="logoutEverywhere" class="text-sm text-slate-500 hover:text-slate-700">Sign out everywhere</button>
        <form method="post" action="/logout"><button class="text-sm font-medium text-slate-700 hover:text-slate-900">Sign out</button></form>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    function banner(text, ok) {
      const el = document.getElementById('banner');
      el.textContent = text;
      el.className = 'mb-4 px-4 py-3 rounded-xl text-sm ' +
        (ok ? 'bg-green-50 border border-green-200 text-green-700'
            : 'bg-red-50 border border-red-200 text-red-700');
    }
    if (params.get('linked')) banner(`Linked ${params.get('linked')} account.`, true);
    if (params.get('link_error') === 'already_linked')
      banner('That account is already linked to a different user.', false);

    async function load() {
      const resp = await fetch('/api/me');
      if (resp.status === 401) { location.href = '/'; return; }
      const me = await resp.json();

      document.getElementById('who').textContent = me.displayName || me.email || 'Your account';
      if (me.superAdmin) document.getElementById('adminLink').classList.remove('hidden');

      const wrap = document.getElementById('identities');
      wrap.innerHTML = '';
      for (const i of me.identities) {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between px-3 py-2 rounded-lg bg-slate-50 text-sm';
        const label = document.createElement('span');
        label.className = 'text-slate-700';
        label.textContent = `${i.provider} · ${i.label ?? ''}`;
        row.appendChild(label);
        if (i.removable && me.identities.length > 1) {
          const btn = document.createElement('button');
          btn.className = 'text-xs text-red-500 hover:text-red-700';
          btn.textContent = 'Unlink';
          btn.onclick = async () => {
            const r = await fetch(`/api/identities/${i.iIdentityId}`, { method: 'DELETE' });
            const body = await r.json();
            if (!r.ok) banner(body.error || 'Could not unlink.', false);
            load();
          };
          row.appendChild(btn);
        }
        wrap.appendChild(row);
      }

      const links = document.getElementById('linkButtons');
      links.innerHTML = '';
      const linkedProviders = new Set(me.identities.map((i) => i.provider));
      for (const p of me.linkable) {
        if (linkedProviders.has(p.id)) continue;
        const a = document.createElement('a');
        a.href = `/auth/${p.id}/link`;
        a.className = 'flex items-center justify-center w-full py-2.5 px-4 rounded-xl border border-slate-200 hover:border-slate-300 hover:bg-slate-50 transition-all text-slate-700 font-medium text-sm';
        a.textContent = `Link a ${p.label} account`;
        links.appendChild(a);
      }
    }

    document.getElementById('logoutEverywhere').onclick = async () => {
      await fetch('/api/logout-everywhere', { method: 'POST' });
      location.href = '/';
    };

    load();
  </script>
</body>
</html>
