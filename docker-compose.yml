# Standalone dev — for the full stack use EchoOrchestrator instead.
#
# The identity service reads everything it needs from the NocoDB base
# IdentityBase (table auth_tbl_Settings), including the coordinates of the
# identity database. The only things stated here are how to reach that base.
services:
  identity:
    build: .
    container_name: identity
    hostname: identity
    environment:
      PORT: "3200"
      # The two things a deployment states.
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:-http://host.docker.internal:18090}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
      # Optional overrides of auth_tbl_Settings rows. Blank counts as unset,
      # so leaving these alone keeps the zero-config path: the public base
      # URL is whatever URL the browser reached this service on, the trusted
      # network and the database coordinates come from the settings table,
      # and the first-run wizard collects what is missing.
      IDENTITY_TRUSTED_NETWORK: ${IDENTITY_TRUSTED_NETWORK:-}
      IDENTITY_TRUSTED_PROXY_CIDRS: ${IDENTITY_TRUSTED_PROXY_CIDRS:-}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      PARENT_DOMAIN: ${PARENT_DOMAIN:-}
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
